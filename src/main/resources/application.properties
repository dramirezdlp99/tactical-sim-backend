# Server Configuration
# ${PORT:9096}: Render (y la mayoria de plataformas de hosting) inyectan
# su propia variable de entorno PORT y esperan que la app escuche ahi.
# En tu maquina local, PORT no existe, asi que cae al valor de respaldo
# 9096 (el mismo de siempre) y todo sigue igual para desarrollo.
server.port=${PORT:9096}

# Application Name
spring.application.name=tactical-sim-backend

# Perfil activo: en Render se configura SPRING_PROFILES_ACTIVE=prod
# como variable de entorno. En tu maquina, sin esa variable, sigue
# siendo "dev" como hasta ahora.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Base de datos: por defecto sigue siendo H2 en memoria (cero config para
# correr localmente, igual que siempre). PARA EL DESPLIEGUE EN RENDER:
# define estas 5 variables de entorno con los datos que te da Neon al
# crear el proyecto Postgres (Connection string):
#   DATABASE_URL=jdbc:postgresql://<host-de-neon>/<db>?sslmode=require
#   DATABASE_DRIVER=org.postgresql.Driver
#   DATABASE_USERNAME=<usuario que te dio Neon>
#   DATABASE_PASSWORD=<contraseña que te dio Neon>
#   JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect
# Sin esas variables (en tu maquina local), cae a H2 en memoria exactamente
# como hasta ahora -- por eso los datos locales se siguen borrando al
# reiniciar el backend, eso es esperado y no es un bug.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:tactical_sim_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# SEGURIDAD - IMPORTANTE PARA EL DESPLIEGUE:
# La consola de H2 (/h2-console) permite ejecutar SQL arbitrario contra
# la base de datos desde el navegador, sin autenticacion propia. Es util
# en desarrollo local, pero es una puerta abierta grave si el backend
# esta desplegado en una URL publica.
# ANTES DE DESPLEGAR EN RENDER: agrega la variable de entorno
#   H2_CONSOLE_ENABLED=false
# en el panel de Render. En tu maquina local, sin esa variable, sigue
# quedando habilitada (true) para que puedas seguir depurando igual.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
# JPA_DIALECT sigue el mismo patron que el datasource de arriba: en Render
# se define JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect; en local,
# sin esa variable, sigue usando el dialecto de H2 como hasta ahora.
# ddl-auto=update crea/actualiza las tablas solo automaticamente tanto en
# H2 como en Postgres -- no hace falta un script de migracion aparte para
# este proyecto academico.
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# El valor despues de ":" es SOLO un respaldo para que el proyecto
# siga corriendo "de una" al clonarlo localmente (sin pasos extra de
# configuracion). Es un secreto NUEVO (SecureRandom, 256 bits) que
# nunca ha estado expuesto en ningun commit -- reemplaza al que se
# filtro en el historial de git anteriormente.
#
# PARA EL DESPLIEGUE EN RENDER: esto es obligatorio, no opcional.
# En el panel de Render, agrega la variable de entorno:
#   JWT_SECRET=<genera uno nuevo y distinto a este de respaldo>
# Asi el backend desplegado usa un secreto que NUNCA ha existido en
# ningun archivo del repo, ni siquiera este.
jwt.secret=${JWT_SECRET:27e0995b346cdb87110904b8d724c149b1f568b6c61b1c0641e5c0fa773c57bd}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: origenes permitidos, separados por coma.
# En local, sin variable de entorno, sigue permitiendo solo
# localhost:3000 / 127.0.0.1:3000 (igual que antes).
# PARA EL DESPLIEGUE: en Render agrega la variable de entorno
#   CORS_ALLOWED_ORIGINS=https://tu-proyecto.vercel.app
# (la URL real que te de Vercel al desplegar el frontend). Si necesitas
# permitir mas de un origen (ej. tambien un dominio propio despues),
# sepáralos por coma: https://tu-proyecto.vercel.app,https://tudominio.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# URL del AI Engine (FastAPI). WebClientConfig.java ya la lee con este
# mismo nombre de propiedad (ai.engine.url), con el mismo patron de
# respaldo -- este archivo solo la declara explicitamente para que
# quede documentada aqui junto a las demas variables de entorno.
# PARA EL DESPLIEGUE: agrega la variable de entorno
#   AI_ENGINE_URL=https://tu-ai-engine-desplegado.com
# con la URL real donde termine corriendo el AI Engine.
ai.engine.url=${AI_ENGINE_URL:http://localhost:8000}

# Envio real del codigo 2FA por correo (Brevo/SMTP).
# app.mail.enabled=false (respaldo) => el codigo sigue imprimiendose en
# consola, como hasta ahora, para que el proyecto corra sin necesitar
# cuenta de Brevo. Para activar el envio real:
#   1. Crea una cuenta gratis en Brevo (app.brevo.com) y verifica un
#      correo remitente (Settings -> Senders).
#   2. Genera una SMTP key en Settings -> SMTP & API -> SMTP.
#   3. Define estas variables de entorno (NUNCA las pongas aqui en
#      texto plano -- a diferencia del JWT secret, esta es la
#      contrasena de una cuenta real de terceros):
#        MAIL_ENABLED=true
#        BREVO_SMTP_LOGIN=<tu login SMTP de Brevo>
#        BREVO_SMTP_KEY=<tu SMTP key generada>
#        MAIL_FROM_ADDRESS=<el correo que verificaste como remitente>
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM_ADDRESS:no-reply@tacticalsim.local}
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_LOGIN:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
# Si tu antivirus intercepta el trafico TLS y rompe la conexion en el
# puerto 587 (STARTTLS) -- se ve como "No subject alternative DNS name
# matching smtp-relay.brevo.com found" -- prueba con SSL directo en el
# puerto 465 en vez de desactivar el antivirus, definiendo:
#   BREVO_SMTP_PORT=465
#   MAIL_STARTTLS_ENABLE=false
#   MAIL_SSL_ENABLE=true

# Health check (/actuator/health): muchos hosts gratuitos (Render incluido)
# bloquean conexiones salientes por SMTP para evitar spam. Spring Boot, al
# detectar spring-boot-starter-mail, agrega automaticamente un chequeo que
# intenta conectarse a Brevo como parte de /actuator/health -- si ese
# puerto esta bloqueado, marca TODO el servicio como "DOWN" aunque la app
# este funcionando bien (el envio real de 2FA ya maneja sus propios
# errores por separado, en EmailService, sin depender de este chequeo).
# Por eso se desactiva aqui solo el indicador de salud del correo.
management.health.mail.enabled=false
# Muestra el detalle de cada chequeo (db, diskSpace, etc.) en vez de solo
# el estado general -- ayuda a diagnosticar mas rapido si algo mas falla.
management.endpoint.health.show-details=always